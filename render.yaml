# =====================================================================
# APEX Full-Stack - Render Blueprint (one-click deploy)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy:  GitHub repo push karein -> Render "New +" -> "Blueprint" ->
#          ye file select karein -> Deploy.
# Note   : free plan par SQLite in-container chalta hai (redeploy par
#          reset). Permanent DB ke liye paid plan par persistent disk
#          attach karein ya APEX_DB ko managed path par point karein.
# =====================================================================
services:
  - type: web
    name: apex-fullstack
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APEX_ADMIN_USER
        value: admin
      - key: APEX_ADMIN_PASS
        value: Apex@Secure-2026      # deploy ke foran baad Render dashboard se badlein
      # Render automatically sets PORT; app usi par listen karta hai.
